    <script>
        // ഫയർബേസിൽ നിന്ന് സേവ് ചെയ്ത കസ്റ്റം സെറ്റുകൾ ലോഡ് ചെയ്യുക
        async function loadTestSets() {
            const container = document.getElementById('test-sets-container');
            if (!window.db) {
                setTimeout(loadTestSets, 500);
                return;
            }

            try {
                const querySnapshot = await window.firebaseGetDocs(window.firebaseCollection(window.db, "custom_test_sets"));
                let setsList = [];
                querySnapshot.forEach((docItem) => {
                    setsList.push({ id: docItem.id, ...docItem.data() });
                });

                if (setsList.length === 0) {
                    container.innerHTML = `<div class="no-data">തൽക്കാലം കസ്റ്റം സെറ്റുകൾ ഒന്നും ഇല്ല. ഏതെങ്കിലും മോക്ക് ടെസ്റ്റ് എഴുതി റിസൾട്ട് പേജിലെ ബട്ടൺ വഴി പുതിയ സെറ്റുകൾ സേവ് ചെയ്യാവുന്നതാണ്.</div>`;
                    return;
                }

                container.innerHTML = '';
                setsList.forEach((setItem) => {
                    let card = document.createElement('div');
                    card.className = 'set-card';
                    card.innerHTML = `
                        <div class="set-info">
                            <h3>${setItem.setName}</h3>
                            <p>ചോദ്യങ്ങളുടെ എണ്ണം: ${setItem.questions ? setItem.questions.length : 0}</p>
                        </div>
                        <div class="btn-group">
                            <button class="btn-start" onclick='startCustomExam(${JSON.stringify(setItem)})'>ടെസ്റ്റ് എഴുതുക</button>
                            <button class="btn-delete" onclick="deleteTestSet('${setItem.id}')">✕</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("സെറ്റുകൾ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്:", e);
                container.innerHTML = `<div class="no-data">ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.</div>`;
            }
        }

        // സെറ്റ് ഡിലീറ്റ് ചെയ്യാൻ
        window.deleteTestSet = async function(setId) {
            if (confirm("ഈ ടെസ്റ്റ് സെറ്റ് ഒഴിവാക്കണമെന്നുറപ്പാണോ?")) {
                try {
                    await window.firebaseDeleteDoc(window.firebaseDoc(window.db, "custom_test_sets", setId));
                    loadTestSets();
                } catch (e) {
                    console.error("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പിഴവ്:", e);
                }
            }
        };

        // സെറ്റ് എടുത്തു ടെസ്റ്റ് സ്റ്റാർട്ട് ചെയ്യാൻ
        let currentExamQuestions = [];
        let currentExamIndex = 0;
        let customUserAnswers = {};

        window.startCustomExam = function(setItem) {
            if (!setItem.questions || setItem.questions.length === 0) {
                alert('ഈ സെറ്റിൽ ചോദ്യങ്ങൾ ഒന്നും ലഭ്യമല്ല.');
                return;
            }
            currentExamQuestions = setItem.questions;
            currentExamIndex = 0;
            customUserAnswers = {};
            
            document.getElementById('active-set-title').innerText = setItem.setName;
            document.getElementById('main-review-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.add('active');
            renderExamQuestion();
        }

        function renderExamQuestion() {
            if (currentExamIndex >= currentExamQuestions.length) {
                showCustomExamResults();
                return;
            }

            let qData = currentExamQuestions[currentExamIndex];
            let container = document.getElementById('exam-question-container');
            let optsContainer = document.getElementById('exam-options-container');
            
            container.innerHTML = `
                <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 6px;">ചോദ്യം ${currentExamIndex + 1} / ${currentExamQuestions.length}</div>
                <div class="q-title">${qData.question}</div>
            `;

            let optsHtml = '';
            if (qData.options && Array.isArray(qData.options)) {
                qData.options.forEach((opt, oIdx) => {
                    let isSelected = customUserAnswers[currentExamIndex] === oIdx ? 'selected' : '';
                    let optLetter = ['എ', 'ബി', 'സി', 'ഡി'][oIdx] || '';
                    optsHtml += `<div class="option-item ${isSelected}" onclick="selectCustomOption(${oIdx})">${optLetter}) ${opt}</div>`;
                });
            } else {
                optsHtml = `<div style="color: #dc2626;">ഈ ചോദ്യത്തിന് ഓപ്ഷനുകൾ ലഭ്യമായിട്ടില്ല.</div>`;
            }
            optsContainer.innerHTML = optsHtml;

            document.getElementById('next-btn').innerText = (currentExamIndex === currentExamQuestions.length - 1) ? "ടെസ്റ്റ് ഫലം കാണുക" : "അടുത്ത ചോദ്യം";
        }

        window.selectCustomOption = function(optIndex) {
            customUserAnswers[currentExamIndex] = optIndex;
            renderExamQuestion();
        }

        window.nextCustomQuestion = function() {
            if (customUserAnswers[currentExamIndex] === undefined) {
                if (!confirm("ഈ ചോദ്യത്തിന് ഉത്തരം നൽകിയിട്ടില്ല. അടുത്ത ചോദ്യത്തിലേക്ക് പോകണോ?")) {
                    return;
                }
            }
            currentExamIndex++;
            renderExamQuestion();
        }

        function showCustomExamResults() {
            let correct = 0;
            let wrong = 0;

            currentExamQuestions.forEach((q, idx) => {
                let userAns = customUserAnswers[idx];
                if (userAns !== undefined && userAns === q.ans) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            let container = document.getElementById('exam-question-container');
            let optsContainer = document.getElementById('exam-options-container');

            container.innerHTML = `
                <h2 style="color: #4f46e5; margin-bottom: 10px;">ടെസ്റ്റ് പൂർത്തിയായി! 🎉</h2>
                <p style="font-size: 1.05rem; margin-bottom: 8px;">ശരിയായ ഉത്തരങ്ങൾ: <strong style="color: #10b981;">${correct}</strong></p>
                <p style="font-size: 1.05rem; margin-bottom: 15px;">ശരിയല്ലാത്തവ / അറ്റൻഡ് ചെയ്യാത്തവ: <strong style="color: #ef4444;">${wrong}</strong></p>
            `;
            optsContainer.innerHTML = `
                <button class="btn-action" onclick="exitExam()" style="width: 100%; padding: 12px;">മടങ്ങിപ്പോവുക</button>
            `;
            document.getElementById('next-btn').style.display = 'none';
        }

        window.exitExam = function() {
            document.getElementById('exam-screen').classList.remove('active');
            document.getElementById('main-review-screen').classList.remove('hidden');
            document.getElementById('next-btn').style.display = 'block';
            loadTestSets();
        }
    </script>
