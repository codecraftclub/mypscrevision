<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ചരിത്രം - സബ് ടോപ്പിക്കുകൾ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #eef2f7;
            padding: 15px;
            margin: 0;
        }

        /* മുകളിലെ പ്രധാന നീല ഹെഡിങ് ബോക്സ് */
        .main-header {
            background-color: #1b365d;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .main-header h2 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .main-header p {
            margin: 0;
            font-size: 14px;
            color: #d1d5db;
        }

        /* ഉള്ളിലെ വെള്ള ബോക്സ് (Card) */
        .card {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #1f2937;
        }

        /* കാർഡിനുള്ളിലെ നേർത്ത വര */
        .divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin-bottom: 15px;
        }

        /* ബട്ടൺ പോലെ തോന്നിക്കുന്ന ലിങ്ക് */
        .btn-link {
            display: block;
            background-color: #0066ff;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-link:active {
            background-color: #0052cc;
        }

        /* താഴെയുള്ള ഹോം പേജ് ബട്ടൺ (കറുപ്പ് നിറം) */
        .back-btn {
            display: block;
            background-color: #222222;
            color: white;
            text-align: center;
            padding: 14px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <!-- മുകളിലെ ഹെഡിങ് കാർഡ് -->
    <div class="main-header">
        <h2>📜 ചരിത്രം (History)</h2>
        <p>സബ് ടോപ്പിക്കുകൾ</p>
    </div>

    <!-- 1. കേരളം ബോക്സ് -->
    <div class="card">
        <h3>1. കേരളം</h3>
        <hr class="divider">
        <a href="kerala_history.html" class="btn-link">കേരള ചരിത്രം - ഉള്ളടക്കം / ടെസ്റ്റുകൾ</a>
    </div>

    <!-- 2. ഇന്ത്യ ബോക്സ് -->
    <div class="card">
        <h3>2. ഇന്ത്യ</h3>
        <hr class="divider">
        <a href="indian_history.html" class="btn-link">ഇന്ത്യൻ ചരിത്രം - ഉള്ളടക്കം / ടെസ്റ്റുകൾ</a>
    </div>

    <!-- 3. ലോകം ബോക്സ് -->
    <div class="card">
        <h3>3. ലോകം</h3>
        <hr class="divider">
        <a href="world_history.html" class="btn-link">ലോക ചരിത്രം - ഉള്ളടക്കം / ടെസ്റ്റുകൾ</a>
    </div>

    <!-- തിരികെ പോകുന്നതിനുള്ള ബട്ടൺ -->
    <a href="index.html" class="back-btn">&larr; ഹോം പേജിലേക്ക് തിരികെ പോവുക</a>

</body>
</html>
