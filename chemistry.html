<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry - Mocktest & Flashcards</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .banner-box {
            background-color: #198754;
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(25, 135, 84, 0.2);
        }
        .banner-box h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: bold;
        }
        .banner-box p {
            margin: 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .chapter-row {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .chapter-row:hover {
            border-color: #198754;
            box-shadow: 0 4px 8px rgba(25, 135, 84, 0.1);
        }
        .chapter-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            display: block;
        }

        .sub-btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-mock {
            flex: 1;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-mock:hover {
            background-color: #0b5ed7;
        }

        .btn-flash {
            flex: 1;
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        .btn-flash:hover {
            background-color: #ffca2c;
        }

        .btn-back {
            display: block;
            width: 100%;
            background-color: #198754;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 25px;
            box-sizing: border-box;
        }
        .btn-back:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="banner-box">
        <h2>⚗️ കെമിസ്ട്രി (Chemistry)</h2>
        <p>സബ്‌ടോപ്പിക്കുകൾ തിരഞ്ഞെടുക്കുക</p>
    </div>

    <!-- ആറ്റവും തന്മാത്രകളും -->
    <div class="chapter-row">
        <span class="chapter-title">ആറ്റവും തന്മാത്രകളും (Atom & Molecules)</span>
        <div class="sub-btn-group">
            <a href="atom.html" class="btn-mock">📝 Mock Test</a>
            <a href="atom.html" class="btn-flash">⚡ Flash Cards</a>
        </div>
    </div>

    <a href="index.html" class="btn-back">← പ്രധാന ഡാഷ്‌ബോർഡിലേക്ക് തിരികെ പോവുക</a>
</div>

</body>
</html>
