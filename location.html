<!DOCTYPE html>
<html>
<head>
    <title>Map Integration with Live Location</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome for Location Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        #map { width: 100%; height: 600px; }
        
        /* ലൈവ് ലൊക്കേഷൻ ബട്ടണിന്റെ സ്റ്റൈൽ */
        .locate-btn {
            background-color: white;
            width: 34px;
            height: 34px;
            border-radius: 4px;
            border: 2px solid rgba(0,0,0,0.2);
            text-align: center;
            line-height: 30px;
            cursor: pointer;
            font-size: 16px;
            color: #333;
        }
        .locate-btn:hover {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h2>Google Maps & OpenStreetMap Integration</h2>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // മാപ്പ് സെറ്റ് ചെയ്യുക (കേരള ഭാഗത്തേക്ക് സെന്റർ ചെയ്യുന്നു)
        var map = L.map('map').setView([12.5, 75.1], 14);

        // 1. Google Satellite Layer
        var googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        // 2. OpenStreetMap Layer (ഭുവന് പകരമായി ഉപയോഗിക്കാവുന്ന മികച്ച ബേസ് മാപ്പ്)
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        // ലെയർ കൺട്രോൾ
        var baseMaps = {
            "Google Satellite": googleSat,
            "OpenStreetMap": osmLayer
        };
        L.control.layers(baseMaps).addTo(map);

        // --- ലൈവ് ലൊക്കേഷൻ കൺട്രോൾ ബട്ടൺ ---
        var LocateControl = L.Control.extend({
            options: {
                position: 'topleft'
            },
            onAdd: function (map) {
                var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                var button = L.DomUtil.create('div', 'locate-btn', container);
                button.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i>';
                button.title = "എന്റെ ലൈവ് ലൊക്കേഷൻ കാണുക";

                L.DomEvent.on(button, 'click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true});
                });

                return container;
            }
        });

        map.addControl(new LocateControl());

        map.on('locationfound', function(e) {
            var radius = e.accuracy / 2;
            L.marker(e.latlng).addTo(app = map)
                .bindPopup("നിങ്ങൾ ഇവിടെയാണ്! (കൃത്യത: " + radius.toFixed(1) + " മീറ്റർ)").openPopup();
            L.circle(e.latlng, radius).addTo(map);
        });

        map.on('locationerror', function(e) {
            alert("ലൊക്കേഷൻ കണ്ടെത്താനായില്ല. ദയവായി ജി.പി.എസ് പെർമിഷൻ പരിശോധിക്കുക.");
        });

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            
            L.popup()
                .setLatLng(e.latlng)
                .setContent("Latitude: " + lat.toFixed(5) + "<br>Longitude: " + lng.toFixed(5))
                .openOn(map);
        });
    </script>
</body>
</html>
